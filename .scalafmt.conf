version = "3.11.5"

style = default
runner.dialect = scala3

maxColumn = 100
indent.main = 2
align.preset = some
danglingParentheses.preset = true

rewrite.rules = [
  RedundantParens
  SortModifiers
]
rewrite.sortModifiers.preset = styleGuide
rewrite.trailingCommas.style = never

# Keep Scala 3 syntax with curly braces rather than rewriting to significant indentation.
rewrite.scala3.convertToNewSyntax = false
rewrite.scala3.optionalBraces.enabled = false

fileOverride {
  "glob:**/*.sbt" {
    runner.dialect = sbt1
  }
}
