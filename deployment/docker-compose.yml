services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 2s
      retries: 30
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
      DEBUG: "${DEBUG:-0}"
      PERSISTENCE: "0"
      SERVICES: "cloudformation,cloudwatch,dynamodb,dynamodbstreams,ecr,ecs,iam,kinesis,lambda,logs,s3,ssm,sts"
    volumes:
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock"
