services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: $LOCALSTACK_TOKEN
      DEBUG: "${DEBUG:-0}"
      PERSISTENCE: "0"
      SERVICES: "cloudformation,cloudwatch,dynamodb,dynamodbstreams,ecr,ecs,iam,kinesis,lambda,logs,s3,ssm,sts"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
